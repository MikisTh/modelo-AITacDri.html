<script>

const API_URL =
"https://modelo-aitacdri-html-1.onrender.com";

let totais = {
  carbo: 0,
  proteina: 0,
  gordura: 0,
  fibra: 0,
  sodio: 0,
  calcio: 0,
  ferro: 0,
  kcal: 0
};

async function verificarAPI() {

  const status =
    document.getElementById("apiStatus");

  try {

    const response = await fetch(
      API_URL + "/alimentos"
    );

    if (!response.ok) {
      throw new Error("API inválida");
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error("Resposta inválida");
    }

    status.classList.remove("offline");
    status.classList.add("online");

    status.innerText =
      "API conectada";

  } catch (error) {

    console.error(error);

    status.classList.remove("online");
    status.classList.add("offline");

    status.innerText =
      "API desconectada";

  }

}

verificarAPI();

async function adicionarAlimentoAPI() {

  const nome =
    document.getElementById("nome")
    .value
    .trim();

  const quantidade =
    Number(
      document.getElementById("quantidade")
      .value
    );

  if (!nome) {

    alert("Informe o alimento");
    return;

  }

  if (!quantidade || quantidade <= 0) {

    alert("Informe a quantidade");
    return;

  }

  document.body.classList.add("loading");

  try {

    const response = await fetch(
      API_URL + "/calcular",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          nome,
          quantidade
        })
      }
    );

    if (!response.ok) {

      throw new Error(
        "Erro ao consultar API"
      );

    }

    const data =
      await response.json();

    if (data.erro) {

      alert(data.erro);
      return;

    }

    adicionarNaTabela(data);

  } catch (error) {

    console.error(error);

    alert(
      "Erro ao conectar com a API"
    );

  } finally {

    document.body
      .classList
      .remove("loading");

  }

}

function adicionarNaTabela(data) {

  const tabela =
    document.getElementById(
      "tabelaAlimentos"
    );

  tabela.innerHTML += `
    <tr>
      <td>${data.nome}</td>

      <td>
        ${data.quantidade} g
      </td>

      <td>
        ${Number(
          data.carboidrato
        ).toFixed(2)} g
      </td>

      <td>
        ${Number(
          data.proteina
        ).toFixed(2)} g
      </td>

      <td>
        ${Number(
          data.gordura
        ).toFixed(2)} g
      </td>

      <td>
        ${Number(
          data.fibra
        ).toFixed(2)} g
      </td>

      <td>
        ${Number(
          data.sodio
        ).toFixed(2)} mg
      </td>

      <td>
        ${Number(
          data.kcal
        ).toFixed(2)} kcal
      </td>
    </tr>
  `;

  totais.carbo +=
    Number(data.carboidrato);

  totais.proteina +=
    Number(data.proteina);

  totais.gordura +=
    Number(data.gordura);

  totais.fibra +=
    Number(data.fibra);

  totais.sodio +=
    Number(data.sodio);

  totais.calcio +=
    Number(data.calcio);

  totais.ferro +=
    Number(data.ferro);

  totais.kcal +=
    Number(data.kcal);

  atualizarTotais();

  limparCampos();

}

function atualizarTotais() {

  document.getElementById(
    "totalCarbo"
  ).innerText =
    totais.carbo.toFixed(2) + " g";

  document.getElementById(
    "totalProteina"
  ).innerText =
    totais.proteina.toFixed(2) + " g";

  document.getElementById(
    "totalGordura"
  ).innerText =
    totais.gordura.toFixed(2) + " g";

  document.getElementById(
    "totalFibra"
  ).innerText =
    totais.fibra.toFixed(2) + " g";

  document.getElementById(
    "totalSodio"
  ).innerText =
    totais.sodio.toFixed(2) + " mg";

  document.getElementById(
    "totalCalcio"
  ).innerText =
    totais.calcio.toFixed(2) + " mg";

  document.getElementById(
    "totalFerro"
  ).innerText =
    totais.ferro.toFixed(2) + " mg";

  document.getElementById(
    "totalKcal"
  ).innerText =
    totais.kcal.toFixed(2) + " kcal";

}

function limparCampos() {

  document.getElementById(
    "nome"
  ).value = "";

  document.getElementById(
    "quantidade"
  ).value = "";

}

function limparTabela() {

  document.getElementById(
    "tabelaAlimentos"
  ).innerHTML = "";

  totais = {
    carbo: 0,
    proteina: 0,
    gordura: 0,
    fibra: 0,
    sodio: 0,
    calcio: 0,
    ferro: 0,
    kcal: 0
  };

  atualizarTotais();

}

</script>
